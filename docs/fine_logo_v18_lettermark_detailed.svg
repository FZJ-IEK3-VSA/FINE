<?xml version="1.0" encoding="UTF-8"?>
<!--
  ETHOS.FINE Logo — Variant 18: Detailed F-lettermark, rich transition scene
  ──────────────────────────────────────────────────────────────────
  Based on v17 with modifications:
  - ETHOS font-size increased to align cap-height with back F top (y≈2)
  - N5' house moved lower to avoid overlap with dotted connector
  - N1' gas flare replaced with cooling tower (coal/nuclear style)
  - N4' factory reduced to avoid overlap

  Back F (fossil era, opacity 0.25):
    N1'(4,2)   cooling tower           (trapezoid + pipe + steam, standing on node)
    N2'(76,2)  gas flare tower         (derrick + flame standing on node)
    N3'(4,36)  old grid hub            (●)
    N4'(52,36) heavy industry          (○ + chimney + sawtooth factory + smoke)
    N5'(4,70)  old city + fossil car   (○ + sedan left + row house right, lower)

  Front F (clean era, full opacity):
    N1(42,40)   wind farm (2 turbines)  (◆ + main + secondary turbine)
    N2(114,40)  solar panel             (◆ + perspective panel on stand)
    N3(42,74)   modern substation       (●○ ring)
    N4(90,74)   green industry          (○ + factory + dual solar roof)
    N5(42,108)  modern city + EV        (○ + EV left + building right)

  Colours: #003865 (deep blue) · #e87722 (orange) · #1a5490 (mid blue)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -28 336 154" width="336" height="154">


<!-- ═══════════════════════════════════════════════════════════════
     t₁  FOSSIL ERA — back layer, opacity 0.25
     N1'(4,2)  N2'(76,2)  N3'(4,36)  N4'(52,36)  N5'(4,70)
     ═══════════════════════════════════════════════════════════════ -->
<g opacity="0.25" fill="#003865" stroke="#003865">

  <!-- F edges -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="2"  x2="76" y2="2"/>
    <line x1="4" y1="2"  x2="4"  y2="36"/>
    <line x1="4" y1="36" x2="52" y2="36"/>
    <line x1="4" y1="36" x2="4"  y2="70"/>
  </g>

  <!-- ── N1' (4,2) — COOLING TOWER (coal/nuclear, standing on node) ── -->
  <!-- Tower body (trapezoid, wide base, narrow top) -->
  <path d="M -2,2 L 1,-10 L 7,-10 L 10,2 Z"/>
  <!-- Top rim / opening -->
  <rect x="0" y="-12" width="8" height="2" rx="0.3"/>
  <!-- Pipe on right side curving down -->
  <path d="M 8,-7 Q 13,-4 12,2" fill="none" stroke-width="1.8"/>
  <!-- Steam cloud from top -->
  <ellipse cx="4" cy="-16" rx="5" ry="3.5"/>
  <circle cx="1" cy="-20" r="2.5"/>
  <circle cx="6" cy="-19" r="1.8" opacity="0.7"/>

  <!-- ── N2' (76,2) — GAS FLARE TOWER (standing on node) ───── -->
  <!-- Tower frame (filled trapezoid silhouette) -->
  <path d="M 72,2 L 74.5,-10 L 77.5,-10 L 80,2 Z"/>
  <!-- Cross bracing -->
  <line x1="73.5" y1="-2" x2="78.5" y2="-6" stroke-width="1" fill="none"/>
  <line x1="78.5" y1="-2" x2="73.5" y2="-6" stroke-width="1" fill="none"/>
  <!-- Platform bar at top -->
  <rect x="72" y="-12" width="8" height="2" rx="0.3"/>
  <!-- Flame -->
  <path d="M 76,-24 Q 71,-17 76,-12 Q 81,-17 76,-24 Z"/>
  <!-- Inner flame highlight -->
  <path d="M 76,-20 Q 74,-15 76,-12.5 Q 78,-15 76,-20 Z" fill="white" opacity="0.25"/>
  <!-- Heat waves -->
  <path d="M 80,-19 Q 81.5,-21 80,-23" fill="none" stroke-width="1"/>
  <path d="M 82,-17 Q 83,-19 82,-21" fill="none" stroke-width="0.8" opacity="0.6"/>

  <!-- ── N3' (4,36) — OLD GRID HUB ──────────────────────────── -->
  <circle cx="4" cy="36" r="5.5"/>

  <!-- ── N4' (52,36) — FACTORY (reduced size, base at node) ──── -->
  <circle cx="52" cy="36" r="5.5" fill="white" stroke-width="2"/>
  <!-- Chimney (narrower, tapered) -->
  <path d="M 58,36 L 60,23 L 62.5,23 L 64,36 Z"/>
  <!-- Chimney top cap -->
  <rect x="59" y="20" width="4.5" height="3" rx="0.3"/>
  <!-- Smoke clouds (smaller) -->
  <circle cx="66" cy="17" r="1.8"/>
  <circle cx="68" cy="14" r="2"/>
  <circle cx="64.5" cy="11.5" r="1.3" opacity="0.7"/>
  <!-- Factory building (compact) -->
  <rect x="64" y="29" width="9" height="7" rx="0.3"/>
  <!-- Sawtooth roof (3 triangular peaks) -->
  <polygon points="64,29 67,23 67,29 70,23 70,29 73,23 73,29"/>
  <!-- Windows -->
  <rect x="66" y="32" width="1.8" height="1.8" fill="white" rx="0.2"/>
  <rect x="69.5" y="32" width="1.8" height="1.8" fill="white" rx="0.2"/>

  <!-- ── N5' (4,70) — OLD CITY + FOSSIL CAR demand ──────────── -->
  <circle cx="4" cy="70" r="5.5" fill="white" stroke-width="2"/>
  <!-- Fossil car (left of spine) -->
  <rect x="-16" y="72" width="12" height="4" rx="1"/>
  <polygon points="-13.5,72 -12,69 -8.5,69 -7,72"/>
  <circle cx="-13" cy="77" r="1.5"/>
  <circle cx="-7.5" cy="77" r="1.5"/>
  <circle cx="-13" cy="77" r="0.6" fill="white"/>
  <circle cx="-7.5" cy="77" r="0.6" fill="white"/>
  <!-- Exhaust smoke -->
  <circle cx="-18" cy="73.5" r="1.3" opacity="0.5"/>
  <!-- Old row house (right of spine, moved lower to clear dotted line) -->
  <rect x="13" y="62" width="10" height="9" rx="0.3"/>
  <polygon points="13,62 18,57 23,62"/>
  <rect x="15" y="65" width="2.5" height="2.5" fill="white" rx="0.2"/>

</g>


<!-- ═══════════════════════════════════════════════════════════════
     PILLAR CONNECTORS  (t₁ → t₂, 38 px offset)
     ═══════════════════════════════════════════════════════════════ -->
<g stroke="#003865" stroke-width="0.9" stroke-opacity="0.16"
   stroke-dasharray="3,2.5" stroke-linecap="round" fill="none">
  <line x1="4"  y1="2"  x2="42"  y2="40"/>
  <line x1="76" y1="2"  x2="114" y2="40"/>
  <line x1="4"  y1="36" x2="42"  y2="74"/>
  <line x1="52" y1="36" x2="90"  y2="74"/>
  <line x1="4"  y1="70" x2="42"  y2="108"/>
</g>


<!-- ═══════════════════════════════════════════════════════════════
     t₂  CLEAN FUTURE — front layer, full opacity
     N1(42,40)  N2(114,40)  N3(42,74)  N4(90,74)  N5(42,108)
     ═══════════════════════════════════════════════════════════════ -->

<!-- F edges: stroke-width=8 matches Helvetica Neue Bold at font-size 94 -->
<g fill="none" stroke="#003865" stroke-width="8"
   stroke-linecap="round" stroke-linejoin="round">
  <line x1="42"  y1="40"  x2="114" y2="40"/>
  <line x1="42"  y1="40"  x2="42"  y2="74"/>
  <line x1="42"  y1="74"  x2="90"  y2="74"/>
  <line x1="42"  y1="74"  x2="42"  y2="108"/>
</g>

<!-- ── N1 (42,40) — WIND FARM supply (2 turbines) ────────────── -->
<path d="M 42,31 L 51,40 L 42,49 L 33,40 Z" fill="#e87722"/>
<!-- Main turbine -->
<line x1="42" y1="31" x2="42" y2="19"
      fill="none" stroke="#e87722" stroke-width="2" stroke-linecap="round"/>
<g fill="none" stroke="#e87722" stroke-width="2" stroke-linecap="round">
  <line x1="42"  y1="19" x2="42"   y2="11"/>
  <line x1="42"  y1="19" x2="35.1" y2="23"/>
  <line x1="42"  y1="19" x2="48.9" y2="23"/>
</g>
<!-- Second smaller turbine -->
<line x1="33" y1="35" x2="33" y2="26"
      fill="none" stroke="#e87722" stroke-width="1.5" stroke-linecap="round"/>
<g fill="none" stroke="#e87722" stroke-width="1.5" stroke-linecap="round">
  <line x1="33" y1="26" x2="33"   y2="20"/>
  <line x1="33" y1="26" x2="28.5" y2="29"/>
  <line x1="33" y1="26" x2="37.5" y2="29"/>
</g>

<!-- ── N2 (114,40) — SOLAR PANEL (perspective tilted on stand) ── -->
<path d="M 114,31 L 123,40 L 114,49 L 105,40 Z" fill="#e87722"/>
<!-- Stand from diamond to panel -->
<line x1="114" y1="31" x2="114" y2="24"
      fill="none" stroke="#e87722" stroke-width="1.8" stroke-linecap="round"/>
<!-- Solar panel (perspective trapezoid) -->
<polygon points="108,14 120,14 125,24 103,24"
         fill="#e87722" fill-opacity="0.20" stroke="#e87722" stroke-width="1.5"/>
<!-- Panel bottom frame (thicker near edge) -->
<line x1="103" y1="24" x2="125" y2="24"
      stroke="#e87722" stroke-width="2.5" stroke-linecap="round"/>
<!-- Grid lines -->
<g stroke="#e87722" stroke-width="0.9" fill="none">
  <line x1="106.3" y1="17.3" x2="121.7" y2="17.3"/>
  <line x1="104.7" y1="20.7" x2="123.3" y2="20.7"/>
  <line x1="111"   y1="14" x2="108.5" y2="24"/>
  <line x1="114"   y1="14" x2="114"   y2="24"/>
  <line x1="117"   y1="14" x2="119.5" y2="24"/>
</g>

<!-- ── N3 (42,74) — MODERN SUBSTATION HUB ────────────────────── -->
<circle cx="42" cy="74" r="9" fill="#003865"/>
<circle cx="42" cy="74" r="4" fill="white"/>

<!-- ── N4 (90,74) — GREEN INDUSTRY demand ────────────────────── -->
<circle cx="90" cy="74" r="7" fill="white" stroke="#003865" stroke-width="2.2"/>
<rect x="99" y="62" width="16" height="14" fill="#003865" rx="0.5"/>
<rect x="98" y="60" width="18" height="3" fill="#003865" rx="0.5"/>
<rect x="101" y="66" width="3" height="3" fill="white" rx="0.3"/>
<rect x="107" y="66" width="3" height="3" fill="white" rx="0.3"/>
<rect x="101" y="71" width="3" height="3" fill="white" rx="0.3"/>
<rect x="107" y="71" width="3" height="3" fill="white" rx="0.3"/>
<rect x="100" y="56" width="5" height="3" fill="#e87722" fill-opacity="0.3"
      stroke="#e87722" stroke-width="0.8" rx="0.3"/>
<rect x="107" y="56" width="5" height="3" fill="#e87722" fill-opacity="0.3"
      stroke="#e87722" stroke-width="0.8" rx="0.3"/>

<!-- ── N5 (42,108) — MODERN CITY + EV + CHARGING demand ──────── -->
<circle cx="42" cy="108" r="7" fill="white" stroke="#003865" stroke-width="2.2"/>
<!-- Electric car to the left -->
<g fill="#003865" stroke="none">
  <rect x="16" y="106" width="16" height="5" rx="1.5"/>
  <polygon points="19,106 21,102 27,102 29,106"/>
  <circle cx="20" cy="112" r="2"/>
  <circle cx="28" cy="112" r="2"/>
  <circle cx="20" cy="112" r="0.8" fill="white"/>
  <circle cx="28" cy="112" r="0.8" fill="white"/>
</g>
<!-- EV lightning bolt -->
<path d="M 24.5,103.5 L 22.5,106.5 L 25,106 L 23,109.5"
      fill="none" stroke="#e87722" stroke-width="1.2"
      stroke-linejoin="round" stroke-linecap="round"/>
<!-- Charging station -->
<rect x="10.5" y="104" width="2.5" height="8" fill="#003865" rx="0.3"/>
<rect x="9" y="103" width="5.5" height="3.5" fill="#003865" rx="0.5"/>
<path d="M 12,104 L 11,105.5 L 12.5,105 L 11.5,107"
      fill="none" stroke="#e87722" stroke-width="0.8"
      stroke-linejoin="round" stroke-linecap="round"/>
<!-- Modern building to the right -->
<rect x="49" y="88" width="15" height="13" fill="#003865" rx="0.5"/>
<polygon points="49,88 56.5,82 64,88" fill="#003865"/>
<rect x="51" y="92" width="3" height="3" fill="white" rx="0.3"/>
<rect x="58" y="92" width="3" height="3" fill="white" rx="0.3"/>


<!-- ═══════════════════════════════════════════════════════════════
     WORDMARK:  ETHOS + INE  completing  FINE
     ═══════════════════════════════════════════════════════════════ -->

<!-- ETHOS — cap-height aligned with back F top (y≈2) -->
<text x="134" y="31"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="40" font-weight="300" fill="#1a5490"
      letter-spacing="6">ETHOS</text>

<!-- INE — cap-height ≈ 68 px matching F network span y=40→108 -->
<text x="134" y="108"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="94" font-weight="700" fill="#003865"
      letter-spacing="1">INE</text>

</svg>
