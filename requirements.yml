name: fine_env

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.10,<3.14
  - pip
  - geopandas <=0.14.4
  - glpk
  - openpyxl <=3.1.5
  - matplotlib <=3.9.2
  - xlrd <=2.0.1
  - pyomo >=6.8,<=6.9.4
  - numpy >=1.22,<=2.3.3
  - pandas >=1.4,<=2.2.3
  - scipy <=1.16.2
  - scikit-learn >=1.2,<=1.7.2
  - xarray <=2025.9.0
  - rasterio <=1.4.3
  - netcdf4 <=1.7.2
  - tsam
  - pwlf <=2.2.1
  - psutil <=7.1.0
  - gurobi-logtools <=3.1.0
  - ipykernel <=6.29.5
