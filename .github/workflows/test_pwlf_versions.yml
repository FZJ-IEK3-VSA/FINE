on:
  workflow_dispatch:
  push:
    branches: ["485_test_dependency_range_new_release"]
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }} for pwlf=${{ matrix.pwlf_version }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        pwlf_version:
          [
            "2.0.4",
            "2.0.5",
            "2.1.0",
            "2.2.0",
            "2.2.1",
            "2.3.0",
            "2.4.0",
            "2.5.0",
            "2.5.1",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements_dev.yml
      ipynb_example_folder: "examples"
      library_name: "pwlf"
      library_version: ${{ matrix.pwlf_version }}
      dependency_position_env_file: "16"

