on:
  push:
    branches: ["480_test_pyomo"]
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }} for pyomo=${{ matrix.pyomo_version }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        pyomo_version:
          [
            "4.3.11377",
            "4.4.1",
            "5.0.1",
