            "5.7.1",
            "5.7.2",
            "5.7.3",
            "6.0",
            "6.0.1",
            "6.1.1",
            "6.1.2",
            "6.2",
            "6.3.0",
            "6.4.0",
            "6.4.1",
            "6.4.2",
            "6.4.3",
            "6.4.4",
            "6.5.0",
            "6.6.0",
            "6.6.1",
            "6.6.2",
            "6.7.0",
            "6.7.1",
            "6.7.2",
            "6.7.3",
            "6.8.0",
            "6.8.1",
            "6.8.2",
            "6.9.0",
            "6.9.1",
            "6.9.2",
            "6.9.3",
            "6.9.4",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements_dev.yml
      ipynb_example_folder: "examples"
      library_name: "pyomo"
      library_version: ${{ matrix.pyomo_version }}
      dependency_position_env_file: "7"

