on:
  workflow_dispatch:
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }} for pandas=${{ matrix.pandas_version }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        pandas_version: ["2.3", "2.2", "2.1", "2.0", "1.5", "1.4"]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements_dev.yml
      ipynb_example_folder: "examples"
      library_name: "pandas"
      library_version: ${{ matrix.pandas_version }}
      dependency_position_env_file: "9"

