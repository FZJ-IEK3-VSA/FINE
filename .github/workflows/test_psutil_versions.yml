on:
  push:
    branches: ["485_test_dependency_range_new_release"]
  pull_request:
    branches: ["master"]

jobs:
  TestPushCondaForgeDev:
    name: Test conda-forge development version on ${{ matrix.runner_tag }} for psutil=${{ matrix.psutil_version }}
    strategy:
      fail-fast: false
      matrix:
        runner_tag: ["self-hosted"]
        psutil_version:
          [
            "4.1.0",
            "4.2.0",
            "4.3.0",
            "4.3.1",
            "4.4.2",
            "5.0.1",
            "5.1.3",
            "5.2.0",
            "5.2.1",
            "5.2.2",
            "5.3.1",
            "5.4.0",
            "5.4.3",
            "5.4.4",
            "5.4.5",
            "5.4.6",
            "5.4.7",
            "5.4.8",
            "5.5.0",
            "5.5.1",
            "5.6.1",
            "5.6.2",
            "5.6.3",
            "5.6.4",
            "5.6.5",
            "5.6.7",
            "5.7.0",
            "5.7.2",
            "5.7.3",
            "5.8.0",
            "5.9.0",
            "5.9.1",
            "5.9.2",
            "5.9.3",
            "5.9.4",
            "5.9.5",
            "5.9.6",
            "5.9.7",
            "5.9.8",
            "6.0.0",
            "6.1.0",
            "6.1.1",
            "7.0.0",
            "7.1.0",
          ]
    uses: FZJ-IEK3-VSA/.github/.github/workflows/_run_single_conda_forge_test.yml@main
    with:
      runner_tag: ${{ matrix.runner_tag }}
      requirements_file_name: requirements_dev.yml
      ipynb_example_folder: "examples"
      library_name: "psutil"
      library_version: ${{ matrix.psutil_version }}
      dependency_position_env_file: "17"

