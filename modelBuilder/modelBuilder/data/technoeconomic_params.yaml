conversion:
  liquefaction:
    physicalUnit: "GW$_{LH_{2},LHV}$"
    commodityConversionFactors: {
        hydrogen_liquid: 1,
        electricity: -0.2, #-1*LQf_electric_efficiency,
        hydrogen_gas: -1.02, #-1/LQf_h2_efficiency
      }
    investPerCapacity:  #### TODO: double-check with others
      2020: 1.5
      2030: 1.5
      2040: 1.5
      2050: 1.5
    opexFix: 0.08 # 8 % of investPerCapacity #### TODO: double-check with others
    opexPerOperation: 0
    interestRate: 0.08
    economicLifetime: 20
    citation: "FINE.Infrastructure"
    comment: "What is this source?"

  electrolyzer_pem_NoCompressor:
    physicalUnit: "GW$_{el}$$"
    commodityConversionFactors: {
        electricity: -1,
        hydrogen_gas: 0.7, #FINE.Nestor costs are in EUR/kW_el
      }
    investPerCapacity:
      2020: 0.800
      2030: 0.500
      2040: 0.400
      2050: 0.350
    opexFix: 0.03 # investPerCapacity * 3.0 %
    opexPerOperation: 0
    economicLifetime: 10
    interestRate: 0.08
    citation: "Stolten et. al:, Neue Ziele auf alten Wegen? Strategien für eine treibhausgasneutrale Energieversorgung bis zum Jahr 2045, 2021"

  compressor:
    physicalUnit: "GW$_{H_{2},LHV}$"
    commodityConversionFactors: {
      hydrogen_30bar: -1,
      electricity: -0.02,
      hydrogen_gas: 0.99    # 1% H2 losses in compression process, a little high, but there for no pipeline losses
    }
    investPerCapacity: # Mrd. Euros per GW H2 capacity
      2020: 0.042
      2030: 0.042
      2040: 0.042
      2050: 0.042
    opexFix: 0.04 # investPerCapacity + 3.0 %
    opexPerOperation: 0
    interestRate: 0.08
    economicLifetime: 15
    citation: "M. Reuß, Techno-¨okonomische Analyse alternativer Wasserstoffinfrastruktur. Thesis, 2019"

  electrolyzer_pem_compressor: # 
    physicalUnit: "GW$_{el}$"
    commodityConversionFactors: {
        electricity: -1,
        hydrogen_gas: 0.683, # from 0.7 1% H2 loss and devided by 1.014 for compressor electricity demand to not need to adjust the electrolyser electricity input, what would change all investment costs
      }                      # including 1% H2 losses in compression process, a little high, but there for no pipeline losses 
    investPerCapacity:
      2020: 0.8294        # Building sum of PEM and Compressor costs per GW electrolyser electicity 
      2030: 0.5294        # Mrd.EU/GWe = 0.800 Mrd.EU/GW + (10^6/10^9)*(0.7 kW/H2/kWe * 0.02 kWe/kWH2 * 2100 Euro/kWe)
      2040: 0.4294
      2050: 0.3794
    opexFix: 0.03 # investPerCapacity * 3.0 %
    opexPerOperation: 0
    economicLifetime: 10
    interestRate: 0.08
    citation: "See presentation PEM Electrolyzer + Compressor in Techno-economic params folder of FINE Unions Teams group"

  regasification:
    physicalUnit: "GW$_{H_{2},LHV}$"
    commodityConversionFactors: {
        hydrogen_liquid: -1,
        electricity: -0.02,
        hydrogen_gas: 1 
      }
