name: fine_env

channels:
  - conda-forge
  - nodefaults
  - gurobi

dependencies:
  - python >=3.10,<=3.14.3
  - pip
  - geopandas >=1.0.0,<=1.1.4
  - glpk >=4.63,<=5.0
  - openpyxl <=3.1.5
  - matplotlib <=3.11.0
  - xlrd >=1.2.0,<=2.0.2
  - pyomo >=6.8.1,<=6.10.0
  - numpy >=1.22,<=2.4.6
  - pandas >=2.2.0,<3.0.0
  - scipy >=1.7.2,<=1.17.1
  - scikit-learn >=1.3.0,<=1.8.0
  - xarray >=2023.4.1,<=2026.4.0,!=2024.10.0,!=2024.11.0,!=2025.1,!=2025.3,!=2025.9
  - rasterio >=1.3.7,<=1.5.0
  - netcdf4 >1.6.4,<=1.7.4
  - tsam >=3.3.0,<=3.4.1
  - pwlf >=2.5.0,<=2.5.3
  - psutil >=5.8.0,<=7.2.2
  - gurobi >=10.0.0,<=13.0.2
  - gurobi-logtools >=3.2.0,<=4.0.1
  - highspy >=1.13.1, <=1.14.0
  # Examples
  - ipykernel <=7.2.0
  # develop
  - pytest <=9.0.3
  - pytest-cov <=7.1.0
  - pytest-xdist <=3.8.0
  - nbval <=0.11.0
  - ruff <=0.13.1
  # Documentation
  - mkdocs >=1.6,<=1.6.1
  - mkdocs-material >=9.5,<=9.7.6
  - mkdocstrings >=0.25,<=1.0.6
  - mkdocstrings-python >=1.10,<=2.0.4
  - mkdocs-jupyter >=0.25,<=0.25.1
  - mkdocs-gen-files >=0.5,<=0.6.0
  - mkdocs-literate-nav >=0.6,<=0.6.3
  - mkdocs-section-index >=0.3,<=0.3.12
  - griffe >=0.45,<=2.0.2

