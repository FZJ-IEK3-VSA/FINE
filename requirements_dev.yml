name: fine_dev_env

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.10,<=3.13
  - pip
  - geopandas >=1.0.0,<=1.1.2
  - glpk >=4.63,<=5.0
  - openpyxl <=3.1.5
  - matplotlib <=3.10.8
  - xlrd >=1.2.0,<=2.0.2
  - pyomo >=6.8,<=6.9.4
  - numpy >=1.22,<=2.4.2
  - pandas >=1.4,<=2.3.3
  - scipy >=1.7.2,<=1.16.2
  - scikit-learn >=1.2,<=1.8.0
  - xarray >=2022.3.0,<=2026.2.0,!=2024.10.0,!=2024.11.0,!=2025.1.*,!=2025.3.*,!=2025.9.*
  - rasterio >=1.3.7,<=1.4.3
  - netcdf4 >1.6.4,<=1.7.4
  - tsam >=2.0.1,<=2.3.9
  - pwlf >=2.0.4,<=2.5.1
  - psutil >=5.8.0,<=7.2.2
  - gurobi-logtools >=3.0.0,<=3.2.0
  # Examples
  - ipykernel <=6.29.5
  # develop
  - pytest <=8.3.3
  - pytest-cov <=4.1.0
  - pytest-xdist <=3.6.1
  - nbval <=0.11.0
  - ruff <=0.13.1
  # Documentation
  - sphinx <=7.4.7
  - sphinx_rtd_theme <=2.0.0
  - myst-parser <=2.0.0

